<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | RCCG The Brooks</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; padding: 1.5rem; text-align: center;
        background: #f4f8f9; color: #1c2b30;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1417; color: #e6eef0; }
        .card { background: #0f1b1f; border-color: #1b2f36; }
        .hint { color: #8ba3aa; }
      }
      .card {
        max-width: 22rem; padding: 1.75rem; border-radius: 0.75rem;
        background: #fff; border: 1px solid #d8f2f5;
      }
      img { width: 56px; height: 56px; border-radius: 0.75rem; }
      h1 { font-size: 1rem; margin: 1rem 0 0.5rem; }
      .hint { font-size: 0.8125rem; line-height: 1.5; color: #6d6e71; margin: 0; }
      .rule {
        height: 4px; width: 5rem; margin: 0.75rem auto 0; border-radius: 999px;
        background: linear-gradient(90deg,#35b5c2 0 55%,#ef8b24 55% 80%,#58595b 80% 100%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.jpg" alt="RCCG The Brooks" />
      <div class="rule"></div>
      <h1>No connection</h1>
      <p class="hint">
        The attendance dashboard reads its figures live from the church sheet, so
        it needs a connection. Try again once you are back online.
      </p>
    </div>
  </body>
</html>
